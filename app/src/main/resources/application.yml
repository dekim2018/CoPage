# 앞에 둔 프록시(Caddy)가 TLS 를 끝내고 X-Forwarded-Proto, X-Forwarded-For 를 붙인다. Tomcat 은 내부 주소(127/8, 10/8,
# 192.168/16 등)에서 온 요청의 이 헤더만 믿는다. 재발급의 같은 출처 판정(OriginCheck)이 https 를 보게 된다 (D-28).
server:
  forward-headers-strategy: native

spring:
  application:
    name: copage
  threads:
    virtual:
      enabled: true
  # 로컬 개발용 기본값. 저장소 루트의 compose.yaml 로 띄운 PostgreSQL, Redis 와 같다. 배포 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:${COPAGE_DB_PORT:5432}/copage
    username: copage
    password: copage
    hikari:
      # 기본값(30초)이면 DB 가 답하지 않을 때 요청이 30초 매달린다. 짧게 끊고 503 으로 답한다 (docs/07-SECURITY.md 9.7).
      # Hikari 의 값은 밀리초 숫자다("3s" 를 받지 않는다).
      connection-timeout: ${COPAGE_DB_CONNECT_TIMEOUT_MS:3000}
      data-source-properties:
        # 답하지 않는 DB 에 보낸 질의는 기본으로 끝없이 기다린다(일시 정지한 PostgreSQL 로 확인). 그러면 문서 세션의 커밋이
        # 실행 흐름을 영영 막는다. 이 시간(초)이 지나면 실패시켜 세션을 버리고, 클라이언트가 재접속해 다시 맞추게 한다.
        socketTimeout: ${COPAGE_DB_SOCKET_TIMEOUT_SECONDS:10}
  # 마이그레이션은 앱의 연결 풀과 따로 연결한다. 위의 소켓 시간 한도가 데이터를 옮기는 긴 마이그레이션까지 끊지 않게 한다 (D-33).
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  data:
    redis:
      host: localhost
      port: ${COPAGE_REDIS_PORT:6379}
      # 기본값(60초)이면 Redis 가 답하지 않을 때 요청이 1분 동안 매달린다. 짧게 끊고 503 으로 답한다 (docs/07-SECURITY.md 9.7).
      timeout: ${COPAGE_REDIS_TIMEOUT:2s}
      connect-timeout: ${COPAGE_REDIS_CONNECT_TIMEOUT:2s}
  mvc:
    problemdetails:
      enabled: true

# 지표와 상태 확인 (docs/11-TEST-PLAN.md 13.4, 진단 OPS-1). API 와 다른 포트에, 기본으로는 이 기기에서만 받는다.
# 수집기(Prometheus)가 다른 기기에 있으면 COPAGE_MANAGEMENT_ADDRESS 로 열 주소를 정한다. API 포트로는 열지 않는다.
management:
  server:
    port: ${COPAGE_MANAGEMENT_PORT:8081}
    address: ${COPAGE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # 요청 시간을 히스토그램으로 낸다. ErrDeck 의 요약 카드와 성능 화면이 p95 를 여기서 계산한다(D-53).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # 메일 서버가 잠깐 멈췄다고 서버 전체를 DOWN 으로 보지 않는다. 초대 메일은 실패해도 링크로 건넬 수 있다 (D-50).
  health:
    mail:
      enabled: false

# 에러 모니터링 (D-49, docs/DEPLOY.md). DSN 이 비어 있으면 아무것도 보내지 않는다. 처리하지 못한 예외(5xx)와 ERROR 로그만
# 보낸다. 사용자 정보와 쿠키, 인증 헤더는 싣지 않고, 주소의 티켓과 토큰은 보내기 전에 가린다(ErrorReportScrubber).
sentry:
  dsn: ${COPAGE_SENTRY_DSN:}
  environment: ${COPAGE_ENVIRONMENT:local}
  send-default-pii: false
  # @ExceptionHandler 가 처리한 오류(4xx ProblemDetail)는 보내지 않는다. 처리기들이 다 지나친 예외만 잡는다.
  exception-resolver-order: 2147483647
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# ErrDeck (D-53). -Perrdeck=true 로 빌드하고 ERRDECK_DSN 을 줄 때만 켜진다. Sentry 와 같은 규칙으로 가린다: 공유와 초대 토큰,
# 티켓, Bearer 토큰. 쿠키와 인증 헤더, 쿼리의 토큰은 SDK 가 기본으로 가린다.
errdeck:
  dsn: ${ERRDECK_DSN:}
  environment: ${COPAGE_ENVIRONMENT:local}
  release: ${COPAGE_RELEASE:local}
  in-app-packages: com.copage
  redact-paths:
    - (/s/)[^/?#\s"']+
    - (/invite/)[^/?#\s"']+
    - (/api/share/)[^/?#\s"']+
    - (/api/invites/)[^/?#\s"']+
    - ((?:[?&]|\b)ticket=)[^&#\s"']*
    - (Bearer\s+)[A-Za-z0-9._~+/=-]+
  tracing:
    # 요청이 시작될 때 추적할 비율. 뽑히지 않아도 에러와 1초 넘는 요청은 남는다.
    sample-rate: ${ERRDECK_TRACE_SAMPLE_RATE:0.1}

copage:
  # 초대 메일 (W-1, D-50). 메일 서버는 SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD 로 준다.
  # 셋(메일 서버, 보내는 주소, 화면 주소)이 다 있어야 보낸다. 없으면 링크를 직접 건넨다.
  mail:
    from: ${COPAGE_MAIL_FROM:}
    public-url: ${COPAGE_PUBLIC_URL:}
  web:
    # 브라우저에서 API 와 WebSocket 을 부를 수 있는 Origin. 비어 있으면 같은 출처만 받는다.
    allowed-origins: []
    # 노드 이름(문서 소유 리스의 값). 비우면 시작할 때 무작위로 만든다. 노드마다 달라야 한다.
    node-id: ${COPAGE_NODE_ID:}
    # 로그인 없이 부를 수 있는 경로(가입, 로그인, 공유 링크, 초대 보기)의 IP 별 빈도 제한 (D-48).
    rate-limit: ${COPAGE_RATE_LIMIT:true}
  auth:
    # 32 바이트 이상. 저장소에 두지 않는다. 없으면 서버가 뜨지 않는다.
    jwt-secret: ${COPAGE_JWT_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev

copage:
  web:
    # Vite 개발 서버
    allowed-origins:
      - http://localhost:5173
    # 화면 시험(e2e)이 한 주소에서 사용자를 많이 만든다.
    rate-limit: ${COPAGE_RATE_LIMIT:false}
  auth:
    # 개발용 키. dev 프로필에서만 쓴다.
    jwt-secret: ${COPAGE_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
