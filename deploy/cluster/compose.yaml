# 다중 노드 실험용 (docs/CHAOS.md, docs/03-ARCHITECTURE.md 5.3~5.5, D-43). 운영 구성이 아니다.
#
#   ./gradlew :app:bootJar
#   docker compose -f deploy/cluster/compose.yaml up -d --build postgres redis node1 node2 proxy
#   # 노드 추가 실험: docker compose -f deploy/cluster/compose.yaml up -d node3
#
# 프록시(nginx)는 http://localhost:8088 이다. /ws/docs/{docId} 는 문서 ID 로 해시해 노드를 고르고(같은 문서는 같은 노드),
# 나머지 API 는 돌아가며 보낸다. 노드는 고정 주소라 아직 뜨지 않은 node3 도 프록시 설정에 둘 수 있다. 닿지 않는 노드는
# 건너뛰고, 뜨면 그 노드 몫의 문서가 그리로 간다.
x-node: &node
  build:
    context: ../..
  depends_on: [postgres, redis]
  environment: &node-env
    SPRING_PROFILES_ACTIVE: dev
    SPRING_DATASOURCE_URL: jdbc:postgresql://172.30.0.10:5432/copage
    SPRING_DATA_REDIS_HOST: 172.30.0.11
    COPAGE_REDIS_PORT: "6379"
    COPAGE_JWT_SECRET: cluster-experiment-secret-not-for-production-0123456789
    # 프록시 뒤라 Origin 은 프록시 주소다.
    COPAGE_WEB_ALLOWED_ORIGINS: http://localhost:8088
    JAVA_TOOL_OPTIONS: -Xmx1g

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: copage
      POSTGRES_USER: copage
      POSTGRES_PASSWORD: copage
    networks:
      cluster:
        ipv4_address: 172.30.0.10
    ports:
      - "${COPAGE_CLUSTER_DB_PORT:-35432}:5432"

  redis:
    image: redis:7
    networks:
      cluster:
        ipv4_address: 172.30.0.11

  node1:
    <<: *node
    environment:
      <<: *node-env
      COPAGE_NODE_ID: node1
    networks:
      cluster:
        ipv4_address: 172.30.0.21

  node2:
    <<: *node
    environment:
      <<: *node-env
      COPAGE_NODE_ID: node2
    networks:
      cluster:
        ipv4_address: 172.30.0.22

  node3:
    <<: *node
    environment:
      <<: *node-env
      COPAGE_NODE_ID: node3
    networks:
      cluster:
        ipv4_address: 172.30.0.23

  proxy:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cluster:
        ipv4_address: 172.30.0.30
    ports:
      - "${COPAGE_CLUSTER_PORT:-8088}:80"

networks:
  cluster:
    ipam:
      config:
        - subnet: 172.30.0.0/24
