# 문서별 노드 고정 라우팅 (docs/03-ARCHITECTURE.md 5.3 의 1번). 같은 문서는 같은 노드로 간다. 노드가 늘거나 줄면 일관 해시라
# 그 노드 몫의 문서만 옮겨 간다. 옮겨 간 문서는 새 노드가 리스를 넘겨받는다(5.4).
events {}

http {
    map $uri $doc_id {
        ~^/ws/docs/(?<id>[^/]+) $id;
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream by_document {
        hash $doc_id consistent;
        server 172.30.0.21:8080 max_fails=1 fail_timeout=3s;
        server 172.30.0.22:8080 max_fails=1 fail_timeout=3s;
        server 172.30.0.23:8080 max_fails=1 fail_timeout=3s;
    }

    upstream any_node {
        server 172.30.0.21:8080 max_fails=1 fail_timeout=3s;
        server 172.30.0.22:8080 max_fails=1 fail_timeout=3s;
        server 172.30.0.23:8080 max_fails=1 fail_timeout=3s;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://by_document;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout;
        }

        location / {
            proxy_pass http://any_node;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
