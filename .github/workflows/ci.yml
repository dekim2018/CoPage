name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build

      - name: 무작위 테스트 10배
        run: ./gradlew :ot-core:test --rerun-tasks -Dcopage.ot.scale=10

  # 커밋 이력 전체에서 비밀키가 새어 나갔는지 본다 (진단 OPS-2). 버전을 고정해 같은 규칙으로 돈다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 비밀키 검사
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.2 detect --source=/repo --redact --no-banner

  # TypeScript OT 구현이 Java 구현과 같은 결과를 내는지 적합성 벡터로 확인한다.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 적합성 벡터 만들기
        run: ./gradlew :ot-core:exportVectors

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 알려진 취약점이 high 이상인 의존성이 있으면 실패한다 (진단 OPS-2).
      - name: 의존성 취약점
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: 타입 검사와 빌드
        working-directory: frontend
        run: npm run build

      - name: 테스트
        working-directory: frontend
        run: npm test

  # 브라우저 두 개로 같은 문서를 편집하는 화면 테스트 (docs/11-TEST-PLAN.md 13.1).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: copage
          POSTGRES_USER: copage
          POSTGRES_PASSWORD: copage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copage" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 백엔드 jar 만들기
        run: ./gradlew :app:bootJar

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Chromium 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 화면 테스트
        working-directory: frontend
        run: npm run e2e

      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
