name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build

      - name: 무작위 테스트 10배
        run: ./gradlew :ot-core:test --rerun-tasks -Dcopage.ot.scale=10

  # TypeScript OT 구현이 Java 구현과 같은 결과를 내는지 적합성 벡터로 확인한다.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 적합성 벡터 만들기
        run: ./gradlew :ot-core:exportVectors

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 타입 검사
        working-directory: frontend
        run: npm run typecheck

      - name: 테스트
        working-directory: frontend
        run: npm test
